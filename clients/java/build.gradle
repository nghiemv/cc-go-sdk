plugins {
    id 'java-library'
    id 'maven-publish'
}

// Fork-aware publishing: all GitHub URLs derive from GITHUB_REPOSITORY
// (auto-set by Actions to "<owner>/<repo>") so a fork tag publishes to
// its own GitHub Packages without editing this file. Fallback is the
// upstream repo for local builds.
def ghRepo = System.getenv('GITHUB_REPOSITORY') ?: 'USACE/cc-go-sdk'

// Maven group defaults to the upstream coordinate so upstream releases
// stay binary-compatible. Forks that want a distinct coordinate (to
// coexist on a classpath with upstream) can set MAVEN_GROUP in their
// workflow env, e.g. MAVEN_GROUP=io.github.nghiem.
group = System.getenv('MAVEN_GROUP') ?: 'mil.army.usace'
// Version is derived from the JAR_VERSION env var so each release can
// publish a unique Maven coordinate. GitHub Packages rejects re-publish
// of an existing Maven version with HTTP 409; hardcoding version caused
// every second release on a given major.minor.patch (e.g. v2.0.0-fork.4
// after v2.0.0-fork.3) to fail at the publish step. CI derives this from
// the git tag (stripping the leading 'v'). Fallback 2.0.0 is for local
// builds where no JAR_VERSION is set.
version = System.getenv('JAR_VERSION') ?: '2.0.0'

base {
    archivesName = 'cc-sdk'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

// Zero external dependencies — JDK only

// The bundleNatives task copies pre-built cc-sdk binaries into
// src/main/resources/natives/ so they get included in the JAR.
// CI runs this before `jar` with binaries from the build matrix.
tasks.register('bundleNatives', Copy) {
    description = 'Copy cc-sdk binaries into resources for JAR packaging'
    from(project.findProperty('nativesDir') ?: 'natives-staging')
    into('src/main/resources/natives')
    include('cc-sdk-*')
}

tasks.named('processResources') {
    dependsOn 'bundleNatives'
}

// sourcesJar reads src/main/resources (via allSource), and bundleNatives
// writes into the same directory. Gradle 8.14+ refuses to run them in an
// undefined order, so make the dependency explicit. Also exclude the
// natives from the sources JAR — a sources JAR is meant for IDE "go to
// source" navigation and should not carry ~60MB of compiled binaries.
tasks.named('sourcesJar') {
    dependsOn 'bundleNatives'
    exclude 'natives/**'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'mil.army.usace'
            artifactId = 'cc-sdk'
            from components.java

            pom {
                name = 'cc-sdk'
                description = 'Java client for the USACE Cloud Compute SDK'
                url = "https://github.com/${ghRepo}"
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                scm {
                    url = "https://github.com/${ghRepo}"
                    connection = "scm:git:git://github.com/${ghRepo}.git"
                }
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/${ghRepo}")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: ""
            }
        }
    }
}
