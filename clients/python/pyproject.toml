[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-sdk"
version = "2.0.0"
description = "Python client for the USACE Cloud Compute SDK (cc-sdk)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "USACE Cloud Compute", email = "randal.s.goss@usace.army.mil"},
]
keywords = ["usace", "cloud-compute", "cc-sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/USACE/cc-go-sdk"
Issues = "https://github.com/USACE/cc-go-sdk/issues"

[tool.setuptools]
py-modules = ["cc"]

[tool.setuptools.package-data]
"*" = ["cc-sdk*"]
