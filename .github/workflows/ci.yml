name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  go-build:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Build cc-sdk binary
        env:
          CGO_ENABLED: '0'
        run: go build -o cc-sdk ./cmd/cc-sdk

  python-check:
    name: Python client check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -c "import ast; ast.parse(open('clients/python/cc.py').read()); print('OK')"

      - name: Verify packaging
        run: |
          cd clients/python
          pip install build
          python -m build --sdist --wheel
          pip install dist/*.whl
          python -c "from cc import CcSdk, Payload, CcSdkError; print('import OK')"

  client-coverage:
    name: Client coverage check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check all CLI commands have client wrappers
        run: bash scripts/check_client_coverage.sh

  java-check:
    name: Java client check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        working-directory: clients/java
        run: |
          mkdir -p build/classes
          javac -d build/classes src/main/java/mil/army/usace/cc/CcSdk.java
          echo "compile OK"
