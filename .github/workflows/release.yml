name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # -----------------------------------------------------------
  # Step 1: Cross-compile Go binary for all platforms
  # -----------------------------------------------------------
  build-binary:
    name: Build cc-sdk (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w" -o cc-sdk-${GOOS}-${GOARCH}${ext} ./cmd/cc-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cc-sdk-*

  # -----------------------------------------------------------
  # Step 2: Build platform-specific Python wheels
  #
  # Each wheel bundles the cc-sdk binary next to cc.py so that
  # _bin() in cc.py finds it inside site-packages at runtime.
  # Wheels are uploaded as workflow artifacts and then attached
  # to the GitHub Release in Step 3 — there is no separate index
  # server; the Release itself is the index (consumers use
  # pip install --find-links <releases/expanded_assets/vTAG>).
  # -----------------------------------------------------------
  build-wheels:
    name: Build wheel (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: build-binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build platform wheel
        run: |
          pip install setuptools wheel
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          python clients/python/build_wheel.py \
            ./cc-sdk-${{ matrix.goos }}-${{ matrix.goarch }}${ext} \
            ${{ matrix.goos }} \
            ${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clients/python/dist/*.whl

  # -----------------------------------------------------------
  # Step 3: GitHub Release with raw binaries + Python wheels
  #
  # Consumers install the Python client via:
  #   pip install \
  #     --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/vX.Y.Z \
  #     cc-sdk==X.Y.Z
  #
  # Works in forks automatically — the release lives on whichever
  # repo pushed the tag, so fork tags publish to fork releases.
  # -----------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [build-binary, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  # -----------------------------------------------------------
  # Step 4: Publish Java JAR to GitHub Packages (Maven)
  #
  # JAR includes all platform binaries in resources/natives/.
  # CcSdk.java auto-extracts the right one at runtime.
  #
  # Maven coordinates and URLs are parameterized via env so a
  # fork publishes to its own repo's GitHub Packages without
  # code changes. Consumers add to build.gradle:
  #   repositories {
  #     maven { url "https://maven.pkg.github.com/<owner>/cc-go-sdk" }
  #   }
  #   dependencies { implementation 'mil.army.usace:cc-sdk:2.0.0' }
  #
  # Runs after github-release so the JAR appends to the existing
  # release rather than racing to create it.
  # -----------------------------------------------------------
  publish-java:
    name: Maven cc-sdk
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: natives-staging
          merge-multiple: true

      - name: Build JAR with bundled binaries
        working-directory: clients/java
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Gradle's bundleNatives task copies from nativesDir into resources
          gradle jar -PnativesDir=${{ github.workspace }}/natives-staging

      - name: Publish to GitHub Packages
        working-directory: clients/java
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gradle publish

      - name: Append JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: clients/java/build/libs/cc-sdk-*.jar
